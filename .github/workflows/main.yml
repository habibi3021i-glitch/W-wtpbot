name: W-Bot07

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: wbot07
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore WhatsApp session
        uses: actions/cache@v4
        with:
          path: session_bot
          key: wa-session-${{ github.run_id }}
          restore-keys: wa-session-

      - name: Install Dependencies
        run: npm install

      - name: Start WhatsApp Agent
        run: npm start
